<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minha Watchlist</title>
<style>
:root{--bg:#f7f5ee;--card:#fff;--tx:#17171a;--mut:#6c6c74;--ac:#ffc400;--on-ac:#17171a;--ln:#e6e3d8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0f12;--card:#1a1a1f;--tx:#f3f3f5;--mut:#9b9ba5;--ln:#2a2a31}}
:root[data-theme="dark"]{--bg:#0f0f12;--card:#1a1a1f;--tx:#f3f3f5;--mut:#9b9ba5;--ln:#2a2a31}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Avenir Next","Trebuchet MS",system-ui,sans-serif;padding-bottom:84px}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:4px 0 14px;letter-spacing:-.5px}
h2{font-size:17px;margin:22px 0 8px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:12px}.in{flex:1;min-width:0}
.po{width:60px;height:88px;border-radius:8px;background:var(--ln);object-fit:cover;flex:none}
.t{font-weight:700;font-size:16px}.m{color:var(--mut);font-size:13px;margin-top:3px}
.bar{height:6px;background:var(--ln);border-radius:3px;margin:9px 0 3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
button,select,input{font:inherit;color:inherit}
.go{width:100%;margin-top:8px;padding:11px;border:0;border-radius:10px;background:var(--ac);color:var(--on-ac);font-weight:700}
.sm{flex:1;padding:9px 4px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);font-size:13px}
.btns{display:flex;gap:6px;margin-top:8px}
.lnk{background:none;border:0;color:var(--mut);text-decoration:underline;padding:6px}
.eps{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ep{width:42px;height:42px;border-radius:8px;border:1px solid var(--ln);background:var(--bg)}
.ep.on{background:var(--ac);color:var(--on-ac);border-color:var(--ac);font-weight:700}
.sh{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--ln);background:var(--card)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.n{font-size:30px;font-weight:800}
.top{display:flex;gap:8px;margin-top:12px}.top button{flex:1;padding:11px;border-radius:10px;border:1px solid var(--ln);background:var(--card)}
.back{background:none;border:0;padding:6px 0;color:var(--mut)}
.sum{font-size:14px;line-height:1.5;margin-top:12px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;padding:10px 2px;font-size:13px;color:var(--mut)}
nav button.on{color:var(--tx);font-weight:800;box-shadow:inset 0 3px 0 var(--ac)}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
</style>
</head>
<body>
<main><div id="app"></div><div class="m" style="margin-top:28px">Dados e imagens: TVmaze.com</div></main>
<nav id="nav"></nav>
<script>
const K='minha-watchlist-v2',API='https://api.tvmaze.com';
let S=[],tab='watch',cur=null,arm=false,Q='',R=null,busy=0,msg='';
try{S=JSON.parse(localStorage.getItem(K)||'[]')}catch(e){S=[]}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const get=id=>S.find(x=>x.id===id);
const tot=s=>s.seasons.reduce((a,b)=>a+b,0);
const seen=s=>Object.keys(s.w).length;
const done=s=>tot(s)>0&&seen(s)>=tot(s);
const days=s=>s.last?Math.floor((Date.now()-s.last)/864e5):null;
const po=u=>u?`<img class="po" src="${esc(u)}" alt="">`:'<div class="po"></div>';
function nextEp(s){for(let i=0;i<s.seasons.length;i++)for(let e=1;e<=s.seasons[i];e++)if(!s.w[(i+1)+'-'+e])return[i+1,e];return null}
function card(s,btn){
  const n=nextEp(s),p=tot(s)?Math.round(seen(s)/tot(s)*100):0,d=days(s),late=d>14&&s.status==='watching'&&n;
  return `<div class="card"><div class="row" onclick="det('${s.id}')">${po(s.img)}<div class="in"><div class="t">${s.fav?'★ ':''}${esc(s.name)}</div>
  <div class="m">${n?'Próximo: T'+n[0]+' E'+n[1]:'Concluída'}${late?' — parada há '+d+' dias':''}</div>
  <div class="bar"><i style="width:${p}%"></i></div><div class="m">${seen(s)} de ${tot(s)} episódios</div></div></div>
  ${btn&&n?`<button class="go" onclick="mark('${s.id}')">Vi T${n[0]} E${n[1]}</button>`:''}</div>`;
}
const sec=(t,l,b)=>l.length?`<h2>${t} (${l.length})</h2>`+l.map(s=>card(s,b)).join(''):'';
function watch(){
  if(!S.length)return `<h1>Watchlist</h1><div class="empty">Sua lista está vazia.<br>Toque em Buscar para adicionar a primeira série.</div>`;
  const w=S.filter(s=>s.status==='watching'&&!done(s));
  return `<h1>Watchlist</h1>`+sec('Assistindo agora',w.filter(s=>!(days(s)>14)),1)+sec('Faz tempo que não assisto',w.filter(s=>days(s)>14),1)
   +sec('Pausadas',S.filter(s=>s.status==='paused'&&!done(s)),0)+sec('Quero assistir',S.filter(s=>s.status==='want'&&!done(s)),0)+sec('Concluídas',S.filter(done),0);
}
function all(){
  const l=[...S].sort((a,b)=>(b.fav-a.fav)||a.name.localeCompare(b.name));
  return `<h1>Minhas séries</h1>`+(l.length?l.map(s=>card(s,0)).join(''):'<div class="empty">Nenhuma série ainda.</div>');
}
function stats(){
  const eps=S.reduce((a,s)=>a+seen(s),0),f=S.filter(s=>s.fav);
  const t=(n,l)=>`<div class="card"><div class="n">${n}</div><div class="m">${l}</div></div>`;
  return `<h1>Estatísticas</h1><div class="grid">${t(S.length,'séries na lista')}${t(S.filter(done).length,'séries concluídas')}${t(eps,'episódios assistidos')}${t(Math.round(eps*45/60)+' h','tempo estimado (45 min por episódio)')}</div>`
   +`<h2>Favoritas (${f.length})</h2>`+(f.length?f.map(s=>card(s,0)).join(''):'<div class="m">Abra uma série e toque em Favoritar.</div>');
}
function add(){
  return `<h1>Buscar série</h1><div style="display:flex;gap:8px"><input id="q" value="${esc(Q)}" placeholder="Nome da série" onkeydown="if(event.key==='Enter')buscar()">
  <button class="go" style="width:auto;margin:0;padding:0 18px" onclick="buscar()">Buscar</button></div>${msg?`<div class="m" style="margin-top:10px">${msg}</div>`:''}<div style="margin-top:14px">${res()}</div>`;
}
async function buscar(){
  Q=$('q').value.trim();if(!Q)return;R='load';msg='';render();
  try{const r=await fetch(API+'/search/shows?q='+encodeURIComponent(Q));if(!r.ok)throw 0;R=(await r.json()).map(x=>x.show)}catch(e){R='err'}
  render();
}
function res(){
  if(R==='load')return '<div class="empty">Buscando…</div>';
  if(R==='err')return '<div class="empty">Não consegui buscar agora. Confira a internet e tente de novo.</div>';
  if(!R)return '<div class="m">Digite o nome e toque em Buscar.</div>';
  if(!R.length)return '<div class="empty">Nada encontrado.</div>';
  return R.slice(0,10).map(sh=>{
    const has=S.some(s=>s.tv===sh.id),y=(sh.premiered||'').slice(0,4),r=sh.rating&&sh.rating.average;
    const act=busy===sh.id?'<div class="m">Adicionando…</div>':has?'<div class="m">Já está na sua lista</div>'
      :`<div class="btns"><button class="sm" onclick="addShow(${sh.id},'watching')">Assistindo</button><button class="sm" onclick="addShow(${sh.id},'want')">Quero ver</button><button class="sm" onclick="addShow(${sh.id},'done')">Já vi tudo</button></div>`;
    return `<div class="card"><div class="row">${po(sh.image&&sh.image.medium&&sh.image.medium.replace('http:','https:'))}<div class="in"><div class="t">${esc(sh.name)}</div>
    <div class="m">${y}${r?' · ★ '+r:''}${sh.genres&&sh.genres.length?' · '+esc(sh.genres.slice(0,2).join(', ')):''}</div>${act}</div></div></div>`}).join('');
}
async function addShow(id,st){
  const sh=R.find(x=>x.id===id);busy=id;msg='';render();
  try{
    const r=await fetch(API+'/shows/'+id+'/episodes');if(!r.ok)throw 0;
    const c=[];(await r.json()).forEach(e=>{if(e.number!=null)c[e.season-1]=(c[e.season-1]||0)+1});
    for(let i=0;i<c.length;i++)c[i]=c[i]||0;
    const s={id:'t'+id,tv:id,name:sh.name,img:((sh.image&&sh.image.medium)||'').replace('http:','https:'),sum:(sh.summary||'').replace(/<[^>]+>/g,''),
      rate:(sh.rating&&sh.rating.average)||null,year:(sh.premiered||'').slice(0,4),genres:sh.genres||[],
      net:(sh.network&&sh.network.name)||(sh.webChannel&&sh.webChannel.name)||'',seasons:c,w:{},status:st==='done'?'watching':st,fav:false,last:null};
    if(st==='done'){c.forEach((n,i)=>{for(let e=1;e<=n;e++)s.w[(i+1)+'-'+e]=1});s.last=Date.now()}
    S.push(s);save();
  }catch(e){msg='Não deu para adicionar agora. Tente de novo.'}
  busy=0;render();
}
function detail(){
  const s=get(cur);if(!s)return '';
  const se=s.seasons.map((c,i)=>{if(!c)return '';let b='';for(let e=1;e<=c;e++)b+=`<button class="ep ${s.w[(i+1)+'-'+e]?'on':''}" onclick="tog('${s.id}',${i+1},${e})">${e}</button>`;
    return `<div class="sh"><b>Temporada ${i+1}</b><button class="lnk" onclick="seas('${s.id}',${i+1})">marcar toda</button></div><div class="eps">${b}</div>`}).join('');
  return `<button class="back" onclick="back()">‹ Voltar</button><div class="row" style="margin-top:6px">${po(s.img)}<div class="in"><h1 style="margin:0 0 6px">${esc(s.name)}</h1>
  <div class="m">${[s.year,s.net,s.rate?'★ '+s.rate:''].filter(Boolean).map(esc).join(' · ')}</div><div class="m">${esc((s.genres||[]).join(', '))}</div>
  <div class="m">${seen(s)} de ${tot(s)} episódios assistidos</div></div></div>
  ${s.sum?`<div class="sum">${esc(s.sum)}</div>`:''}
  <div class="top"><button onclick="fav('${s.id}')">${s.fav?'★ Favorita':'☆ Favoritar'}</button>
  <select id="sst" onchange="setSt('${s.id}',this.value)" style="flex:1"><option value="watching">Assistindo</option><option value="paused">Pausada</option><option value="want">Quero assistir</option></select></div>
  ${se}<button class="lnk" style="margin-top:26px" onclick="del('${s.id}')">${arm?'Toque de novo para excluir':'Excluir série'}</button>`;
}
function det(id){cur=id;arm=false;render();scrollTo(0,0)}
function tog(id,sn,e){const s=get(id),k=sn+'-'+e;if(s.w[k])delete s.w[k];else{s.w[k]=1;s.last=Date.now();if(s.status==='want')s.status='watching'}save();render()}
function seas(id,sn){const s=get(id),c=s.seasons[sn-1];let a=true;for(let e=1;e<=c;e++)if(!s.w[sn+'-'+e])a=false;
  for(let e=1;e<=c;e++){if(a)delete s.w[sn+'-'+e];else s.w[sn+'-'+e]=1}
  if(!a){s.last=Date.now();if(s.status==='want')s.status='watching'}save();render()}
function mark(id){const s=get(id),n=nextEp(s);if(!n)return;s.w[n[0]+'-'+n[1]]=1;s.last=Date.now();save();render()}
function fav(id){const s=get(id);s.fav=!s.fav;save();render()}
function setSt(id,v){get(id).status=v;save()}
function del(id){if(!arm){arm=true;render();return}S=S.filter(x=>x.id!==id);cur=null;arm=false;save();render()}
function back(){cur=null;render()}
function go(t){tab=t;cur=null;render();scrollTo(0,0)}
function render(){
  $('app').innerHTML=cur?detail():({watch,all,stats,add}[tab])();
  if(cur){const s=get(cur);if(s)$('sst').value=s.status}
  $('nav').innerHTML=[['watch','Watchlist'],['all','Séries'],['stats','Números'],['add','Buscar']].map(([k,l])=>`<button class="${tab===k&&!cur?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
}
render();
</script>
</body>
</html>
