<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0c0e">
<title>Minha Watchlist</title>
<style>
:root{--bg:#0c0c0e;--card:#17171b;--ln:#26262c;--tx:#f4f4f6;--mut:#9a9aa4;--ac:#ffc400;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Avenir Next",system-ui,sans-serif;padding-bottom:96px}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:28px;margin:6px 0 16px;letter-spacing:-.6px}
h2{font-size:18px;margin:26px 0 10px}
button,input{font:inherit;color:inherit}
.mut{color:var(--mut);font-size:13px;margin-top:3px}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:16px;padding:10px;margin-bottom:10px}
.lk{display:flex;gap:12px;align-items:center;flex:1;min-width:0}
.po{width:68px;height:100px;border-radius:10px;background:var(--ln);object-fit:cover;flex:none;display:block}
.in{flex:1;min-width:0}
.t{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:4px;background:var(--ln);border-radius:2px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.chk{width:48px;height:48px;border-radius:50%;border:0;background:var(--ac);color:#111;font-size:22px;font-weight:800;flex:none}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pg .po{width:100%;height:auto;aspect-ratio:2/3}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0;margin-top:12px}
.chip{flex:none;padding:9px 15px;border-radius:20px;border:1px solid var(--ln);background:var(--card)}
.chip.on{background:var(--ac);color:#111;border-color:var(--ac);font-weight:700}
.hero{position:relative;margin:-16px -16px 0;padding:16px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:-20px;background:var(--img) center/cover;filter:blur(28px) brightness(.4)}
.hero>*{position:relative}
.back{background:none;border:0;padding:6px 0 12px}
.er{display:flex;align-items:center;gap:14px;padding:13px 2px;border-bottom:1px solid var(--ln)}
.ck{width:30px;height:30px;border-radius:50%;border:2px solid var(--mut);flex:none;display:flex;align-items:center;justify-content:center;color:#111;font-weight:800}
.er.on .ck{background:var(--ac);border-color:var(--ac)}.er.on .in{color:var(--mut)}
.sum{font-size:14px;line-height:1.55;margin-top:16px;color:#d6d6dc}
.big{display:flex;gap:28px;background:var(--card);border-radius:16px;padding:18px}.big b{font-size:38px;display:block;line-height:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tile{background:var(--card);border-radius:16px;padding:16px}.tile b{font-size:28px;display:block}
.sr{display:flex;gap:8px}
input{flex:1;min-width:0;padding:13px 14px;border-radius:12px;border:1px solid var(--ln);background:var(--card)}
.btn{padding:0 18px;border:0;border-radius:12px;background:var(--ac);color:#111;font-weight:700}
.sm{flex:1;padding:9px 4px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);font-size:13px}
.btns{display:flex;gap:6px;margin-top:10px}
.lnk{background:none;border:0;color:var(--mut);text-decoration:underline;padding:6px 0}
.empty{text-align:center;color:var(--mut);padding:44px 10px;line-height:1.6}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#121215;border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;padding:6px 2px;font-size:11px;color:var(--mut)}
nav button span{display:block;font-size:20px;margin-bottom:2px;filter:grayscale(1);opacity:.7}
nav button.on{color:var(--ac);font-weight:700}nav button.on span{filter:none;opacity:1}
</style>
</head>
<body>
<main><div id="app"></div><div class="mut" style="margin-top:30px">Dados e imagens: TVmaze.com</div></main>
<nav id="nav"></nav>
<script>
const K='minha-watchlist-v2',API='https://api.tvmaze.com';
let S=[],tab='watch',cur=null,ss=null,arm=false,Q='',R=null,busy=0,msg='';
try{S=JSON.parse(localStorage.getItem(K)||'[]')}catch(e){S=[]}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const get=id=>S.find(x=>x.id===id);
const tot=s=>s.seasons.reduce((a,b)=>a+b,0);
const seen=s=>Object.keys(s.w).length;
const done=s=>tot(s)>0&&seen(s)>=tot(s);
const days=s=>s.last?Math.floor((Date.now()-s.last)/864e5):null;
const fmt=d=>d.split('-').reverse().join('/');
const today=()=>new Date().toISOString().slice(0,10);
const po=u=>u?`<img class="po" src="${esc(u)}" alt="" loading="lazy">`:'<div class="po"></div>';
function nextEp(s){for(let i=0;i<s.seasons.length;i++)for(let e=1;e<=s.seasons[i];e++)if(!s.w[(i+1)+'-'+e])return[i+1,e];return null}
function item(s,btn){
  const n=nextEp(s),p=tot(s)?Math.round(seen(s)/tot(s)*100):0,d=days(s),x=n&&s.en&&s.en[n[0]+'-'+n[1]];
  const fut=x&&x[1]&&x[1]>today(),late=d>14&&s.status==='watching'&&n;
  return `<div class="item"><div class="lk" onclick="det('${s.id}')">${po(s.img)}<div class="in"><div class="t">${s.fav?'★ ':''}${esc(s.name)}</div>
  <div class="mut">${n?'T'+n[0]+' E'+n[1]+(x?' · '+esc(x[0]):''):'Concluída'}</div>
  ${fut?`<div class="mut">Estreia em ${fmt(x[1])}</div>`:late?`<div class="mut">Parada há ${d} dias</div>`:''}
  <div class="bar"><i style="width:${p}%"></i></div></div></div>${btn&&n&&!fut?`<button class="chk" onclick="mark('${s.id}')">✓</button>`:''}</div>`;
}
const sec=(t,l,b)=>l.length?`<h2>${t}</h2>`+l.map(s=>item(s,b)).join(''):'';
function watch(){
  if(!S.length)return `<h1>Assistir</h1><div class="empty">Sua lista está vazia.<br>Toque em Buscar para adicionar a primeira série.</div>`;
  const w=S.filter(s=>s.status==='watching'&&!done(s));
  return `<h1>Assistir</h1>`+sec('Assistindo agora',w.filter(s=>!(days(s)>14)),1)+sec('Faz tempo que não assisto',w.filter(s=>days(s)>14),1)
   +sec('Quero assistir',S.filter(s=>s.status==='want'&&!done(s)),0)+sec('Pausadas',S.filter(s=>s.status==='paused'&&!done(s)),0)+sec('Concluídas',S.filter(done),0);
}
function grid(l){return `<div class="pg">${l.map(s=>`<div onclick="det('${s.id}')">${po(s.img)}<div class="mut" style="margin-top:6px">${s.fav?'★ ':''}${esc(s.name)}</div></div>`).join('')}</div>`}
function all(){
  const l=[...S].sort((a,b)=>(b.fav-a.fav)||a.name.localeCompare(b.name));
  return `<h1>Séries</h1>`+(l.length?grid(l):'<div class="empty">Nenhuma série ainda.</div>');
}
function stats(){
  const eps=S.reduce((a,s)=>a+seen(s),0),m=eps*45,f=S.filter(s=>s.fav);
  const t=(n,l)=>`<div class="tile"><b>${n}</b><div class="mut">${l}</div></div>`;
  return `<h1>Perfil</h1><div class="big"><div><b>${Math.floor(m/1440)}</b><div class="mut">dias</div></div><div><b>${Math.floor(m%1440/60)}</b><div class="mut">horas</div></div></div>
  <div class="mut" style="margin-top:6px">Tempo estimado vendo séries (45 min por episódio)</div>
  <div class="grid">${t(eps,'episódios')}${t(S.length,'séries')}${t(S.filter(done).length,'concluídas')}${t(f.length,'favoritas')}</div>
  ${f.length?'<h2>Favoritas</h2>'+grid(f):''}`;
}
function add(){
  return `<h1>Buscar</h1><div class="sr"><input id="q" value="${esc(Q)}" placeholder="Nome da série" onkeydown="if(event.key==='Enter')buscar()"><button class="btn" onclick="buscar()">Buscar</button></div>
  ${msg?`<div class="mut" style="margin-top:10px">${msg}</div>`:''}<div style="margin-top:16px">${res()}</div>`;
}
async function buscar(){
  Q=$('q').value.trim();if(!Q)return;R='load';msg='';render();
  try{const r=await fetch(API+'/search/shows?q='+encodeURIComponent(Q));if(!r.ok)throw 0;R=(await r.json()).map(x=>x.show)}catch(e){R='err'}
  render();
}
function res(){
  if(R==='load')return '<div class="empty">Buscando…</div>';
  if(R==='err')return '<div class="empty">Não consegui buscar agora. Confira a internet e tente de novo.</div>';
  if(!R)return '<div class="mut">Digite o nome da série e toque em Buscar.</div>';
  if(!R.length)return '<div class="empty">Nada encontrado.</div>';
  return R.slice(0,10).map(sh=>{
    const has=S.some(s=>s.tv===sh.id),y=(sh.premiered||'').slice(0,4),r=sh.rating&&sh.rating.average;
    const act=busy===sh.id?'<div class="mut" style="margin-top:10px">Adicionando…</div>':has?'<div class="mut" style="margin-top:10px">Já está na sua lista ✓</div>'
      :`<div class="btns"><button class="sm" onclick="addShow(${sh.id},'watching')">Assistindo</button><button class="sm" onclick="addShow(${sh.id},'want')">Quero ver</button><button class="sm" onclick="addShow(${sh.id},'done')">Já vi tudo</button></div>`;
    return `<div class="item" style="align-items:flex-start">${po(sh.image&&sh.image.medium&&sh.image.medium.replace('http:','https:'))}<div class="in"><div class="t">${esc(sh.name)}</div>
    <div class="mut">${[y,r?'★ '+r:'',(sh.genres||[]).slice(0,2).join(', ')].filter(Boolean).map(esc).join(' · ')}</div>${act}</div></div>`}).join('');
}
async function addShow(id,st){
  const sh=R.find(x=>x.id===id);busy=id;msg='';render();
  try{
    const r=await fetch(API+'/shows/'+id+'/episodes');if(!r.ok)throw 0;
    const c=[],en={};
    (await r.json()).forEach(e=>{if(e.number!=null){c[e.season-1]=(c[e.season-1]||0)+1;en[e.season+'-'+e.number]=[e.name||'',e.airdate||'']}});
    for(let i=0;i<c.length;i++)c[i]=c[i]||0;
    const s={id:'t'+id,tv:id,name:sh.name,img:((sh.image&&sh.image.medium)||'').replace('http:','https:'),sum:(sh.summary||'').replace(/<[^>]+>/g,''),
      rate:(sh.rating&&sh.rating.average)||null,year:(sh.premiered||'').slice(0,4),genres:sh.genres||[],
      net:(sh.network&&sh.network.name)||(sh.webChannel&&sh.webChannel.name)||'',seasons:c,en:en,w:{},status:st==='done'?'watching':st,fav:false,last:null};
    if(st==='done'){c.forEach((n,i)=>{for(let e=1;e<=n;e++)s.w[(i+1)+'-'+e]=1});s.last=Date.now()}
    S.push(s);save();
  }catch(e){msg='Não deu para adicionar agora. Tente de novo.'}
  busy=0;render();
}
function detail(){
  const s=get(cur);if(!s)return '';
  if(ss==null||!s.seasons[ss-1]){const n=nextEp(s);ss=n?n[0]:1}
  const chips=s.seasons.map((c,i)=>c?`<button class="chip ${ss===i+1?'on':''}" onclick="season(${i+1})">T${i+1}</button>`:'').join('');
  let rows='';for(let e=1;e<=(s.seasons[ss-1]||0);e++){const k=ss+'-'+e,x=s.en&&s.en[k];
    rows+=`<div class="er ${s.w[k]?'on':''}" onclick="tog('${s.id}',${ss},${e})"><div class="ck">${s.w[k]?'✓':''}</div><div class="in"><div>E${e}${x&&x[0]?' · '+esc(x[0]):''}</div>${x&&x[1]?`<div class="mut">${fmt(x[1])}</div>`:''}</div></div>`}
  const st=(v,l)=>`<button class="chip ${s.status===v?'on':''}" onclick="setSt('${s.id}','${v}')">${l}</button>`;
  return `<div class="hero" style="--img:url('${esc(s.img)}')"><button class="back" onclick="back()">‹ Voltar</button><div style="display:flex;gap:14px">${po(s.img)}<div class="in"><h1 style="margin:0 0 6px;font-size:24px">${esc(s.name)}</h1>
  <div class="mut">${[s.year,s.net,s.rate?'★ '+s.rate:''].filter(Boolean).map(esc).join(' · ')}</div><div class="mut">${esc((s.genres||[]).join(', '))}</div>
  <div class="mut">${seen(s)} de ${tot(s)} episódios vistos</div></div></div></div>
  <div class="chips">${st('watching','Assistindo')}${st('want','Quero ver')}${st('paused','Pausada')}<button class="chip ${s.fav?'on':''}" onclick="fav('${s.id}')">${s.fav?'★ Favorita':'☆ Favoritar'}</button></div>
  ${s.sum?`<div class="sum">${esc(s.sum)}</div>`:''}
  <h2>Episódios</h2><div class="chips" style="margin-top:0">${chips}</div>
  <div style="text-align:right"><button class="lnk" onclick="seas('${s.id}',${ss})">Marcar temporada toda</button></div>${rows}
  <button class="lnk" style="margin-top:28px" onclick="del('${s.id}')">${arm?'Toque de novo para excluir':'Excluir série'}</button>`;
}
function det(id){cur=id;ss=null;arm=false;render();scrollTo(0,0)}
function season(n){ss=n;render()}
function tog(id,sn,e){const s=get(id),k=sn+'-'+e;if(s.w[k])delete s.w[k];else{s.w[k]=1;s.last=Date.now();if(s.status==='want')s.status='watching'}save();render()}
function seas(id,sn){const s=get(id),c=s.seasons[sn-1];let a=true;for(let e=1;e<=c;e++)if(!s.w[sn+'-'+e])a=false;
  for(let e=1;e<=c;e++){if(a)delete s.w[sn+'-'+e];else s.w[sn+'-'+e]=1}
  if(!a){s.last=Date.now();if(s.status==='want')s.status='watching'}save();render()}
function mark(id){const s=get(id),n=nextEp(s);if(!n)return;s.w[n[0]+'-'+n[1]]=1;s.last=Date.now();save();render()}
function fav(id){const s=get(id);s.fav=!s.fav;save();render()}
function setSt(id,v){get(id).status=v;save();render()}
function del(id){if(!arm){arm=true;render();return}S=S.filter(x=>x.id!==id);cur=null;arm=false;save();render()}
function back(){cur=null;render()}
function go(t){tab=t;cur=null;render();scrollTo(0,0)}
function render(){
  $('app').innerHTML=cur?detail():({watch,all,stats,add}[tab])();
  $('nav').innerHTML=[['watch','📺','Assistir'],['all','🎞️','Séries'],['add','🔍','Buscar'],['stats','👤','Perfil']].map(([k,i,l])=>`<button class="${tab===k&&!cur?'on':''}" onclick="go('${k}')"><span>${i}</span>${l}</button>`).join('');
}
render();
</script>
</body>
</html>
